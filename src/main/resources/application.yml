spring:
  application:
    name: ti-desk
  datasource:
    url: jdbc:postgresql://localhost:5432/tidesk_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

management:
  endpoints:
    web:
    # Asegura la exposición de salud y métricas requeridas (Sección 9 y 11)
      exposure:
        include: health, prometheus, info
  endpoint:
    health:
      show-details: always