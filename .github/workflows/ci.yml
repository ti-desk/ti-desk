name: CI TI-Desk

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tidesk_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Dar permisos de ejecución a mvnw
        run: chmod +x mvnw

      - name: Compilar, probar y verificar Calidad (Checkstyle, SpotBugs, JaCoCo)
        run: mvn -B verify

      - name: Publicar reportes de calidad y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ti-desk-quality-reports
          path: |
            target/site/jacoco/
            target/spotbugs/
            target/checkstyle-result.xml
            target/site/checkstyle.html