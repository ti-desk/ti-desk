name: CI TI-Desk

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Dar permisos de ejecución a mvnw
        run: chmod +x mvnw

      - name: Compilar, probar y verificar Calidad (Testcontainers, Checkstyle, SpotBugs, JaCoCo)
        run: ./mvnw -B verify

      - name: Publicar reportes de calidad y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ti-desk-quality-reports
          retention-days: 14
          path: |
            target/site/jacoco/
            target/spotbugs/
            target/checkstyle-result.xml
            target/site/checkstyle.html